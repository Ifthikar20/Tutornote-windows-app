<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tutornote tutor</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src 'self' file:; img-src 'self' file:" />
    <style>
      /*
        The desktop companion's blob (src/main/companion.ts): Sprout, the seedling in a pot (the web
        app's tutor, lib/guide/avatarArt.ts), smiling with happy eyes and floating on its own over
        every app and every Space: no ring, no picture behind it (the founder, 2026-11-15: "just use
        Sprout ... floating ... smiley, giggly"; the day / evening / night skies are gone). It bobs
        gently in place and has moods (smiles and blinks, winks, giggles, little hearts: see Moods below);
        it giggles when the pointer comes over it. It shows while the tutor is off (resting, or blocked); a click turns the tutor on
        (it hops out and follows the cursor) and Sprout goes, the lesson page's dock (its pause and
        x) being the control while it is on. With a page too old to have that dock, Sprout stays,
        faded with a soft glow, and a click on it turns the tutor off. A drag moves it (the app
        moves the window, so the click is never lost to a drag region); a right click shows its
        menu (Close Sprout). Over it, its label shows beside it, in the room the app gives the
        window for it on the side with more space.

        Looks: resting (Sprout floating), on (faded with a glow: as it hops out, as it flies home,
        and with an older page), reading (its leaves flutter while a window is being read on this
        machine), blocked (a small "!": screen reading is off), hidden (fading out as the tutor
        turns on, before the app hides the window).
      */
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
        font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      .blob { position: absolute; top: 0; left: 0; width: 64px; height: 64px; touch-action: none; }
      body.side-left .blob { left: auto; right: 0; }
      /* (a little inside the window, so its shadow and its bob are not cut at the window's edge) */
      .blob svg {
        display: block; box-sizing: border-box; width: 64px; height: 64px; padding: 4px; overflow: visible;
        filter: drop-shadow(0 3px 5px rgba(30, 16, 54, .25));
        transition: transform .16s ease;
      }
      .blob:hover svg { transform: scale(1.06); }
      body.held .blob svg { transform: scale(.95); }
      .sprout * { transform-box: view-box; }

      /* Floating: a slow bob, the whole of it. */
      .float { animation: float 3.2s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      /* Its leaves sway a little as it floats. */
      .leaf-l { transform-origin: 32.2px 23.4px; animation: sway-l 3.2s ease-in-out infinite; }
      .leaf-r { transform-origin: 32.4px 20.4px; animation: sway-r 3.2s ease-in-out infinite; }
      @keyframes sway-l { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-6deg); } }
      @keyframes sway-r { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(6deg); } }

      /* Giggly: a little wiggle when the pointer comes over it, and as it pops up. */
      .sprout { transform-origin: 32px 58px; transition: opacity .2s ease, transform .3s cubic-bezier(.2, .9, .3, 1.2); }

      /* On: the tutor has hopped out to the cursor; Sprout stays faded with a soft glow
         (hidden: fading out). */
      body.on .sprout, body.reading .sprout { opacity: .55; }
      body.on svg, body.reading svg { filter: drop-shadow(0 0 7px rgba(114, 50, 224, .6)); }
      body.hidden .sprout { opacity: 0; transform: scale(.4) translateY(-10px); }
      /* Reading: its leaves flutter while a window is read on this machine. */
      body.reading .leaf-l { animation: flutter-l .35s ease-in-out infinite; }
      body.reading .leaf-r { animation: flutter-r .35s ease-in-out infinite; }
      @keyframes flutter-l { 0%, 100% { transform: rotate(4deg); } 50% { transform: rotate(-14deg); } }
      @keyframes flutter-r { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(14deg); } }
      /* Blocked: screen reading is off. */
      .alert { opacity: 0; transition: opacity .2s ease; }
      body.blocked .alert { opacity: 1; }
      body.hidden .blob { opacity: 0; transition: opacity .12s ease; }

      /* Shown: it pops up. */
      body.pop .blob svg { animation: pop .32s cubic-bezier(.2, .9, .3, 1.25); }
      @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      /* Moods: one face at a time. Happy is its everyday face; now and then it smiles and blinks,
         winks with its tongue out, giggles, or sends up a heart; over it, it giggles; carried
         about, it goes "wheee"; set down, a heart. */
      .face { display: none; }
      body:not([data-mood]) .f-happy, body[data-mood="happy"] .f-happy, body[data-mood="love"] .f-happy,
      body[data-mood="smile"] .f-smile, body[data-mood="wink"] .f-wink,
      body[data-mood="giggle"] .f-giggle, body[data-mood="wee"] .f-wee { display: inline; }
      .eyes { transform-origin: 32px 43.4px; animation: blink 3.4s infinite; }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
      body[data-mood="giggle"] .sprout { animation: shake .18s ease-in-out 6; }
      @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg) translateY(-1px); } 75% { transform: rotate(4deg) translateY(-1px); } }
      body[data-mood="wee"] .leaf-l { animation: flutter-l .3s ease-in-out infinite; }
      body[data-mood="wee"] .leaf-r { animation: flutter-r .3s ease-in-out infinite; }
      .pop-heart { opacity: 0; transform-box: fill-box; transform-origin: center; }
      body[data-mood="love"] .h1 { animation: rise 1.6s ease-out; }
      body[data-mood="love"] .h2 { animation: rise 1.6s ease-out .35s; }
      body[data-mood="giggle"] .s1, body[data-mood="wink"] .s1 { animation: twinkle 1s ease-out; }
      @keyframes rise { 0% { opacity: 0; transform: translateY(4px) scale(.4); } 25% { opacity: 1; transform: translateY(0) scale(1.1); } 100% { opacity: 0; transform: translateY(-9px) scale(.9); } }
      @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 40% { opacity: 1; transform: scale(1.1) rotate(30deg); } }
      body.on .pop-heart, body.reading .pop-heart, body.hidden .pop-heart { display: none; }

      .label {
        position: absolute; top: 50%; display: none; max-width: 212px; padding: 7px 11px; border-radius: 10px;
        background: #1e1e1e; color: #fff; box-shadow: 0 6px 18px rgba(0, 0, 0, .22); transform: translateY(-50%);
        pointer-events: none;
      }
      body.side-left .label { display: block; right: 72px; }
      body.side-right .label { display: block; left: 72px; }

      @media (prefers-reduced-motion: reduce) {
        .float, .leaf-l, .leaf-r, body.reading .leaf-l, body.reading .leaf-r,
        .eyes, body[data-mood] .sprout, body[data-mood] .leaf-l, body[data-mood] .leaf-r, body[data-mood] .pop-heart { animation: none; }
        .sprout, .blob svg { transition: none; }
        body.pop .blob svg { animation: none; }
      }
    </style>
  </head>
  <body class="resting">
    <div class="label" id="label">Click to turn me on</div>
    <div class="blob" id="blob" role="button" aria-label="Click to turn me on">
      <svg viewBox="4 6 56 56" aria-hidden="true">
        <g class="float">
          <!-- Sprout with happy eyes (the shapes of lib/guide/avatarArt.ts SPROUT, in fixed colours). -->
          <g class="sprout">
            <g stroke="#2b1f1c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="26.2" cy="57.4" rx="3.6" ry="2" fill="#a33a2a" stroke-width="1.8" />
              <ellipse cx="37.8" cy="57.4" rx="3.6" ry="2" fill="#a33a2a" stroke-width="1.8" />
              <path fill="#e5533f" d="M18.8 35.4C27.6 36.4 36.4 36.4 45.2 35.4C44.4 42.4 43.4 49.4 42.2 56C35.4 56.8 28.6 56.8 21.8 56C20.6 49.4 19.6 42.4 18.8 35.4Z" />
              <path fill="#6b4a35" stroke-width="1.8" d="M16.2 31.4C26.6 28.8 37.4 28.8 47.8 31.4C37.4 34 26.6 34 16.2 31.4Z" />
              <path fill="none" d="M32 31.6C31 27.6 33 24 32.2 19.8" />
              <path class="leaf-l" fill="#73ad60" d="M32 23.6C28.8 17.8 23.2 15.2 17.2 16.6C19 22.4 24.8 25.8 32 23.6Z" />
              <path class="leaf-r" fill="#73ad60" d="M32.4 20.4C35 13.8 40.6 10 47.4 10.8C45.8 17.6 39.8 22 32.4 20.4Z" />
              <path fill="#c2412f" d="M16.2 31.4C26.6 34 37.4 34 47.8 31.4C48.2 33.2 48 35 47.4 36.6C37.2 37.8 26.8 37.8 16.6 36.6C16 35 15.8 33.2 16.2 31.4Z" />
            </g>
            <path fill="#fffdf6" opacity="0.4" d="M23 39.4C23.6 43.2 24.4 46.6 25.4 49.4C25.6 45.6 26.4 41.8 27.8 39C26.2 38.8 24.6 39 23 39.4Z" />
            <ellipse cx="24.6" cy="47.6" rx="2.4" ry="1.5" fill="#ef8f7f" opacity="0.8" />
            <ellipse cx="39.4" cy="47.6" rx="2.4" ry="1.5" fill="#ef8f7f" opacity="0.8" />
            <!-- Its moods: one face shows at a time (body data-mood, picked by the script at the end). -->
            <g fill="none" stroke="#2b1f1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <!-- happy: curved closed eyes, a smile (its everyday face) -->
              <path class="face f-happy" d="M25.8 44.2Q28 41.2 30.2 44.2M33.8 44.2Q36 41.2 38.2 44.2M28.8 48Q32 51.6 35.2 48" />
              <!-- smile: open eyes that blink, a smile -->
              <g class="face f-smile">
                <g class="eyes" stroke="none"><ellipse cx="28" cy="43.4" rx="2.1" ry="2.5" fill="#2b1f1c" /><ellipse cx="36" cy="43.4" rx="2.1" ry="2.5" fill="#2b1f1c" /><circle cx="28.8" cy="42.5" r="0.8" fill="#fff" /><circle cx="36.8" cy="42.5" r="0.8" fill="#fff" /></g>
                <path d="M29 48.4Q32 51.4 35 48.4" />
              </g>
              <!-- wink: one eye open, one shut, a cheeky tongue -->
              <g class="face f-wink">
                <g stroke="none"><ellipse cx="28" cy="43.4" rx="2.1" ry="2.5" fill="#2b1f1c" /><circle cx="28.8" cy="42.5" r="0.8" fill="#fff" /></g>
                <path d="M33.8 44.2Q36 41.2 38.2 44.2M28.8 48Q32 51.6 35.2 48" />
                <path d="M32.6 49.6Q33.4 52.6 35 51.8Q35.6 50.8 34.6 49.2" fill="#ec7d84" stroke-width="1.2" />
              </g>
              <!-- giggle: squeezed eyes and a laugh -->
              <g class="face f-giggle">
                <path d="M26 41.8L29.4 43.4L26 45M38 41.8L34.6 43.4L38 45" />
                <path d="M28.6 47.4Q32 48 35.4 47.4Q35 52.2 32 52.4Q29 52.2 28.6 47.4Z" fill="#2b1f1c" stroke-width="1" />
                <path d="M30.2 51Q32 49.8 33.8 51Q33 52.3 32 52.4Q31 52.3 30.2 51Z" fill="#ec7d84" stroke="none" />
              </g>
              <!-- wheee: carried about, big eyes and a little round mouth -->
              <g class="face f-wee">
                <g stroke="none"><ellipse cx="28" cy="43" rx="2.4" ry="2.9" fill="#2b1f1c" /><ellipse cx="36" cy="43" rx="2.4" ry="2.9" fill="#2b1f1c" /><circle cx="28.9" cy="42" r="0.9" fill="#fff" /><circle cx="36.9" cy="42" r="0.9" fill="#fff" /></g>
                <ellipse cx="32" cy="49.6" rx="1.8" ry="2.2" fill="#2b1f1c" stroke="none" />
              </g>
            </g>
          </g>
        </g>
        <!-- Little hearts and a sparkle that float up now and then. -->
        <path class="pop-heart h1" fill="#f472b6" d="M46 18.6C46 16.6 48.6 16.4 49 18.2C49.4 16.4 52 16.6 52 18.6C52 20.6 49 22.4 49 22.4C49 22.4 46 20.6 46 18.6Z" />
        <path class="pop-heart h2" fill="#fb7185" d="M13 24.4C13 22.9 15 22.7 15.3 24.1C15.6 22.7 17.6 22.9 17.6 24.4C17.6 25.9 15.3 27.3 15.3 27.3C15.3 27.3 13 25.9 13 24.4Z" />
        <path class="pop-heart s1" fill="#FDE047" d="M50 30L51 33L54 34L51 35L50 38L49 35L46 34L49 33Z" />
        <!-- Blocked: screen reading is off. -->
        <g class="alert">
          <circle cx="50" cy="15" r="7.5" fill="#f59e0b" stroke="#fff" stroke-width="2" />
          <rect x="48.8" y="10.4" width="2.4" height="6" rx="1.2" fill="#fff" />
          <circle cx="50" cy="19" r="1.4" fill="#fff" />
        </g>
      </svg>
    </div>
    <script>
      (function () {
        var bridge = window.screenBlob;
        if (!bridge) return;
        var body = document.body;
        var blob = document.getElementById("blob");
        var label = document.getElementById("label");
        var LOOKS = ["resting", "on", "reading", "blocked", "hidden"];
        var down = false;

        // Giggly: a little wiggle (as the pointer comes over it, and as it pops up).
        // Its moods (the faces in the markup): one at a time, back to happy after `ms`.
        var back;
        var hovering = false;
        function setMood(mood, ms) {
          body.removeAttribute("data-mood");
          void body.offsetWidth;
          body.setAttribute("data-mood", mood);
          clearTimeout(back);
          if (ms) back = setTimeout(function () { body.setAttribute("data-mood", "happy"); }, ms);
        }
        function giggle() { setMood("giggle", 1300); }
        // Now and then, left alone: a smile and a blink, a wink, a giggle, or a heart.
        var MOODS = [["smile", 4200], ["wink", 2200], ["giggle", 1300], ["love", 2000], ["smile", 4200]];
        (function wander() {
          setTimeout(function () {
            if (!down && !hovering && body.classList.contains("resting")) {
              var pick = MOODS[Math.floor(Math.random() * MOODS.length)];
              setMood(pick[0], pick[1]);
            }
            wander();
          }, 6000 + Math.random() * 7000);
        })();
        setMood("happy");

        bridge.onState(function (state) {
          if (!state) return;
          LOOKS.forEach(function (look) { body.classList.toggle(look, state.look === look); });
          body.classList.toggle("side-left", state.side === "left");
          body.classList.toggle("side-right", state.side === "right");
          if (typeof state.label === "string") {
            label.textContent = state.label;
            blob.setAttribute("aria-label", state.label);
          }
          if (state.pop) {
            body.classList.remove("pop");
            void body.offsetWidth;
            body.classList.add("pop");
            setTimeout(giggle, 320);
          }
        });

        // The bubble pop as the tutor hops out and lands back (companion.ts popSound, which keeps to
        // the Sounds switch). Quiet, as every interface sound is.
        var pop = new Audio("sounds/bubble_pop.mp3");
        pop.preload = "auto";
        pop.volume = 0.6;
        if (bridge.onSound) bridge.onSound(function () {
          try {
            pop.currentTime = 0;
            var playing = pop.play();
            if (playing && playing.catch) playing.catch(function () {});
          } catch (e) {}
        });

        // The app moves the window while the button is down (a drag region would take the click
        // the blob needs), and decides on release whether it was a click or a drag.
        blob.addEventListener("pointerdown", function (e) {
          if (e.button !== 0 || e.ctrlKey) return;
          e.preventDefault();
          down = true;
          setMood("wee");
          try { blob.setPointerCapture(e.pointerId); } catch (_) { /* the release still comes */ }
          body.classList.add("held");
          bridge.dragStart();
        });
        function release() {
          if (!down) return;
          down = false;
          body.classList.remove("held");
          setMood("love", 2000);
          bridge.dragEnd();
        }
        blob.addEventListener("pointerup", release);
        blob.addEventListener("pointercancel", release);
        blob.addEventListener("lostpointercapture", release);
        document.addEventListener("contextmenu", function (e) {
          e.preventDefault();
          bridge.menu();
        });
        blob.addEventListener("mouseenter", function () {
          if (down) return;
          hovering = true;
          bridge.hover(true);
          giggle();
        });
        blob.addEventListener("mouseleave", function () {
          hovering = false;
          bridge.hover(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") bridge.toggle();
        });
      })();
    </script>
  </body>
</html>
